syntax = "proto3";

package recorder;

/* Interface to the grpc service running on the daemon. */
service DaemonService {
    rpc SetStation (StationDefinition) returns (Station) {}
    rpc GetStation (GetStationRequest) returns (Station) {}
    rpc UpdateSensors (UpdateSensorsRequest) returns (UpdateSensorsResponse) {}
    rpc Ping(PingMessage) returns (PingMessage){}
}

enum RecordIntervalConfigurationType{
    NOT_CONFIGURABLE = 0;
    FULLY_CONFIGURABLE = 1;
    MULTIPLE_OF_DEFAULT = 2;
}

message PingMessage{
    int64 randomId = 1;
}

message GetStationRequest{
    string uuid = 1;
}

message UpdateSensorsRequest{
    repeated UpdateSensorRequest updates = 1;
}

message UpdateSensorRequest{
    int64 sensorId = 1;
    SensorState newState = 2;
    int64 updateId = 3;
}

message UpdateSensorsResponse {
    repeated UpdateSensorResponse updates = 1;
}

message UpdateSensorResponse{
    int64 updateId = 1;
    bool success = 2;
    string error = 3;
}

/* Interface to the grpc service running on the station interface. Minimalistic by design. */
service StationInterface {
    rpc GetStationDefinition (GetStationDefinitionRequest) returns (StationDefinition) {}
    rpc GetSensorState (GetSensorStateRequest) returns (SensorState) {}
}

message GetStationDefinitionRequest{

}

message StationDefinition{
    string uuid = 1;
    string interfaceName = 2;
    repeated SensorDefinition sensors = 3;
}

message SensorDefinition{
    string name = 1;
    string element = 2;
    int64 defaultRecordIntervalSeconds = 3;
    RecordIntervalConfigurationType recordIntervalConfigurationType = 4;
    int64 defaultHistoryIntervalSeconds = 5;
    RecordIntervalConfigurationType historyIntervalConfigurationType = 6;
}

message Station{
    string uuid = 1;
    string name = 2;
    double longitude = 3;
    double latitude = 4;
    bool configured = 5;
    repeated Sensor sensors = 6;
}

message Sensor{
    int64 id = 1;
    string name = 2;
    int64 configuredRecordIntervalSeconds = 3;
    int64 configuredHistoryIntervalSeconds = 4;
}

message GetSensorStateRequest{
    string name = 1;
}

message SensorState {
    string unitId = 2;
    int64 created_at = 4;
    double value = 3;
}